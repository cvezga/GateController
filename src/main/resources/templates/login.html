<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">

  <!-- Required for cellphone/mobile layouts -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title th:text="${pageTitle} ?: 'Gate Controller'">
    Gate Controller
  </title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;

      background:
              linear-gradient(
                      rgba(0, 0, 0, 0.55),
                      rgba(0, 0, 0, 0.75)
              ),
              url("/images/garage-background.jpg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /**

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f5f6f8;
      color: #222;
    }
    **/


    .app {
      width: 100%;
      max-width: 360px;
      margin: 0;
      background-color: white;
      border-radius: 10px;
      overflow: hidden;
    }

    header {
      padding: 16px;
      border-bottom: 1px solid #e5e5e5;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    main {
      padding: 16px;
    }

    .card {
      margin-bottom: 16px;
      padding: 16px;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      background-color: white;
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .card p {
      margin: 0 0 12px;
      line-height: 1.5;
      color: #555;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: bold;
    }

    input,
    select,
    textarea,
    button {
      width: 100%;
      min-height: 44px;
      margin-bottom: 14px;
      padding: 10px 12px;
      font-size: 16px;
      border-radius: 8px;
    }

    input,
    select,
    textarea {
      border: 1px solid #ccc;
      background-color: white;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      border: none;
      background-color: #1769e0;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      opacity: 0.85;
    }

    .message {
      padding: 12px;
      margin-bottom: 16px;
      border-radius: 8px;
      background-color: #e8f4ff;
      color: #174d7d;
    }

    footer {
      padding: 16px;
      border-top: 1px solid #e5e5e5;
      text-align: center;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1 th:text="${applicationName} ?: 'Gate Controller'">
      Gate Controller
    </h1>
  </header>

  <main>

    <div class="message"
         th:if="${message}"
         th:text="${message}">
      Operation completed successfully.
    </div>

    <section class="card">
      <form th:action="@{/login}"
            th:object="${loginForm}"
            method="post">
        <input type="hidden"
               th:if="${_csrf != null}"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <label for="user">User</label>
        <input id="user"
               type="text"
               th:field="*{user}"
               placeholder="Enter user name"
               required>

        <label for="password">Password</label>
        <input id="password"
               type="password"
               th:field="*{password}"
               placeholder="Enter your password"
               required>

        <button type="submit">Send</button>

      </form>
    </section>

  </main>

  <footer>
    <span th:text="${#dates.year(#dates.createNow())}">2026</span>
    <span th:text="${applicationName} ?: 'Mobile App'">Mobile App</span>
    <span th:text="'v' + ${applicationVersion}">v0.1.0</span>
  </footer>

</div>

</body>
</html>
